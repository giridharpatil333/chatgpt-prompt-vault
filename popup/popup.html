<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ChatGPT Prompt Vault</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #171717;
      color: #f5f5f5;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .header h1 {
      font-size: 15px;
      font-weight: 700;
      color: #10a37f;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-add {
      background: #10a37f;
      color: #ffffff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-add:hover { background: #0d8a6c; }
    .form-box {
      background: #262626;
      border: 1px solid #333333;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
      display: none;
    }
    .form-box.active { display: block; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 11px; color: #a3a3a3; margin-bottom: 4px; }
    .input, textarea {
      width: 100%;
      background: #171717;
      border: 1px solid #404040;
      border-radius: 6px;
      color: #ffffff;
      padding: 8px;
      font-size: 12px;
      outline: none;
    }
    textarea { height: 70px; resize: vertical; }
    .form-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .btn-cancel { background: transparent; color: #a3a3a3; border: none; font-size: 12px; cursor: pointer; }
    .search-box { margin-bottom: 12px; }
    .list { display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto; }
    .item {
      background: #262626;
      border: 1px solid #333333;
      border-radius: 8px;
      padding: 10px;
    }
    .item-header { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .item-cat { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: rgba(16, 163, 127, 0.2); color: #34d399; }
    .item-prompt { font-size: 11px; color: #a3a3a3; line-height: 1.3; margin-bottom: 6px; }
    .item-actions { display: flex; justify-content: flex-end; gap: 6px; }
    .btn-icon { background: transparent; border: none; color: #737373; font-size: 11px; cursor: pointer; }
    .btn-icon:hover { color: #ef4444; }
  </style>
</head>
<body>
  <div class="header">
    <h1>⚡ Prompt Vault</h1>
    <button class="btn-add" id="btn-toggle-add">+ Add Template</button>
  </div>

  <div class="form-box" id="add-form">
    <div class="form-group">
      <label>Template Title</label>
      <input type="text" class="input" id="inp-title" placeholder="e.g. Code Reviewer" />
    </div>
    <div class="form-group">
      <label>Category</label>
      <input type="text" class="input" id="inp-cat" placeholder="e.g. Engineering" />
    </div>
    <div class="form-group">
      <label>Prompt Body (use {variable} for placeholders)</label>
      <textarea id="inp-prompt" placeholder="Please review this {language} code..."></textarea>
    </div>
    <div class="form-actions">
      <button class="btn-cancel" id="btn-cancel-add">Cancel</button>
      <button class="btn-add" id="btn-save-tpl">Save Template</button>
    </div>
  </div>

  <div class="search-box">
    <input type="text" class="input" id="inp-search" placeholder="Search templates..." />
  </div>

  <div class="list" id="tpl-list"></div>

  <script src="popup.js"></script>
</body>
</html>
